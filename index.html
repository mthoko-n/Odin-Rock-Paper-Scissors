<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
  /* Critical CSS - Prevents FOUC */
  html {
    visibility: hidden;
    opacity: 0;
    scroll-behavior: smooth;
  }
  
  html.loaded {
    visibility: visible;
    opacity: 1;
    transition: opacity 0.3s ease-in;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.documentElement.classList.add('loaded');
  });
</script>
    
    <title>Rock-Paper-Scissors | Mthokozisi Nxumalo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        h1 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 2rem 0;
            padding: 0 1rem;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            max-width: 1200px;
            width: 90%;
            margin: 0 auto 2rem;
            position: relative;
            z-index: 1;
        }

        .game-setup {
            flex: 1;
            min-width: 300px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-setup::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: left 0.5s ease;
        }

        .game-setup:hover::before {
            left: 100%;
        }

        .game-setup:hover {
            border-color: #fff;
            box-shadow: 0 10px 30px rgba(255,255,255,0.05);
        }

        .cue-text {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid #333;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
            transition: all 0.3s ease;
        }

        .cue-text.waiting {
            color: #888;
        }

        .cue-text.win {
            color: #fff;
            border-color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .cue-text.lose {
            color: #666;
            border-color: #444;
        }

        .button-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .game-button {
            flex: 1;
            min-width: 120px;
            padding: 1.25rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            border: 2px solid #333;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .game-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .game-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .game-button:hover {
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.1);
        }

        .game-button:active {
            transform: translateY(0);
        }

        .game-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #222;
        }

        .game-button:disabled:hover {
            transform: none;
            border-color: #222;
            box-shadow: none;
        }

        .panel {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 1.1rem;
        }

        .computer-selection {
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
        }

        .scoreboard {
            flex: 1;
            min-width: 300px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .scoreboard:hover {
            border-color: #fff;
            box-shadow: 0 10px 30px rgba(255,255,255,0.05);
        }

        .scoreboard h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .round-results {
            list-style: none;
        }

        .round {
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid #333;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .round:hover {
            background: rgba(255,255,255,0.04);
            border-color: #444;
        }

        .round:last-child {
            margin-top: 1rem;
            background: rgba(255,255,255,0.05);
            border-color: #555;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .result {
            float: right;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #000;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 3rem;
            z-index: 1001;
            min-width: 400px;
            max-width: 90%;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 20px 60px rgba(255,255,255,0.2);
        }

        .modal:not(.hidden) {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay:not(.hidden) {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .modal-message {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 2rem;
            color: #ccc;
        }

        .next-round-button,
        .new-game-button {
            width: 100%;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .next-round-button:hover,
        .new-game-button:hover {
            background: #000;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.3);
        }

        .creator {
            text-align: center;
            padding: 2rem 1rem;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: auto;
            position: relative;
            z-index: 1;
        }

        .creator p {
            transition: color 0.3s ease;
        }

        .creator:hover p {
            color: #fff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .modal {
                min-width: auto;
                width: 90%;
                padding: 2rem;
            }

            .button-container {
                flex-direction: column;
            }

            .game-button {
                min-width: auto;
            }

            h1 {
                font-size: 2rem;
            }
        }

        /* Fade in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-setup, .scoreboard {
            animation: fadeIn 0.6s ease forwards;
        }

        .scoreboard {
            animation-delay: 0.2s;
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Rock-Paper-Scissors</h1>
    
    <!-- Main content container -->
    <div class="main-container">
        <!-- Game setup container -->
        <div class="game-setup">
            <div class="cue-text waiting">Select your option</div>
            <div class="button-container">
                <button class="game-button rock">Rock</button>
                <button class="game-button paper">Paper</button>
                <button class="game-button scissors">Scissors</button>
            </div>

            <div class="panel">
                Computer selected: <span class="computer-selection">None</span>
            </div>
        </div>

        <!-- Scoreboard container -->
        <div class="scoreboard">
            <h2>Round Results</h2>
            <ul class="round-results">
                <li class="round">Round 1: <span class="result round-1"></span></li>
                <li class="round">Round 2: <span class="result round-2"></span></li>
                <li class="round">Round 3: <span class="result round-3"></span></li>
                <li class="round">Round 4: <span class="result round-4"></span></li>
                <li class="round">Round 5: <span class="result round-5"></span></li>
                <li class="round">Winner: <span class="result winner"></span></li>
            </ul>
        </div>
    </div>

    <!--Modal-->
    <div class="modal hidden">
        <div class="modal-content">
            <h2 class="modal-title">Round Winner</h2>
            <p class="modal-message">TBD</p>
            <button class="next-round-button">Play Next Round</button>
            <button class="new-game-button hidden">Play New Game</button>
        </div>
    </div>
    <div class="modal-overlay hidden"></div>

    <!--Creator tag-->
    <div class="creator">
        <p>Created by Mthokozisi Nxumalo (Mr CEO)</p>
    </div>
</body>
</html>
